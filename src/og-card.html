<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hamza Anjum link preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&display=block">
<style>
  /* 1200 x 630 link-preview card. build.py renders it to site/og-card.png with headless Edge. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #07142B; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #F8FAFC;
          background: radial-gradient(ellipse 50% 80% at 81% 28%, rgba(59, 130, 246, 0.35), transparent 70%),
                      linear-gradient(90deg, #07142B, #0C2350 45%, #143A8B 75%, #0C2350);
          font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
  .text { position: absolute; left: 72px; top: 76px; width: 660px; }
  .eyebrow { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 19px; letter-spacing: 0.08em;
             text-transform: uppercase; color: #93C5FD; margin: 0 0 22px; }
  h1 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 94px; line-height: 1;
       letter-spacing: -0.015em; margin: 0 0 20px; }
  .role { font-family: "Newsreader", Georgia, serif; font-style: italic; font-size: 33px; line-height: 1.22;
          color: #BFDBFE; margin: 0 0 20px; }
  .line { font-size: 22px; line-height: 1.45; color: #DCE6F7; margin: 0; max-width: 610px; }
  .portrait { position: absolute; left: 812px; top: 62px; width: 318px; height: 318px; border-radius: 50%;
              padding: 6px; box-sizing: border-box; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
              background: conic-gradient(from 210deg, #1F2EB8, #3B82F6, #22D3EE, #3B82F6, #1F2EB8); }
  .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
                  border: 6px solid #07142B; box-sizing: border-box; }
  .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 168px; border-top: 1px solid rgba(147, 197, 253, 0.22); }
  canvas { display: block; }
  .tag { position: absolute; top: 14px; font-family: "IBM Plex Mono", Consolas, monospace; border-radius: 6px; }
  .lead { left: 72px; font-size: 15px; letter-spacing: 0.05em; color: #67E8F9; padding: 5px 10px; background: rgba(7, 20, 43, 0.86); border: 1px solid rgba(147, 197, 253, 0.24); }
  .url { right: 72px; font-size: 20px; font-weight: 500; color: #07142B; padding: 4px 14px; background: #FACC15; border-radius: 999px; }
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <p class="eyebrow">MS Electrical Engineering · NUST SEECS</p>
    <h1>Hamza Anjum</h1>
    <p class="role">Biomedical Signal Processing &amp; Machine Learning Researcher</p>
    <p class="line">Explainable ECG models for valvular heart disease, with clinician correction and grounded report generation.</p>
  </div>
  <div class="portrait"><img src="../photo.jpg" alt=""></div>
  <div class="strip">
    <canvas id="c" width="1200" height="168"></canvas>
    <span class="tag lead">LEAD II · 25 mm/s · 10 mm/mV</span>
    <span class="tag url">hamza-anjum.github.io</span>
  </div>
</div>
<script>
  // Same synthetic lead II as the site strip: 25 mm/s, 10 mm/mV, 5 px per mm.
  const ctx = document.getElementById("c").getContext("2d");
  const W = 1200, H = 168, MM = 5, RR = 60 / 72, SECS = W / (25 * MM);
  function beat(t) {
    const g = (c, a, w) => a * Math.exp(-((t - c) * (t - c)) / (2 * w * w));
    return g(-0.17, 0.12, 0.022) + g(-0.035, -0.10, 0.009) + g(0, 1.05, 0.011) + g(0.035, -0.28, 0.011) + g(0.29, 0.30, 0.045);
  }
  function mv(t) {
    const k = Math.round((t - 0.35) / RR), tr = t - (0.35 + k * RR);
    return beat(tr) + beat(tr - RR) + beat(tr + RR) + 0.025 * Math.sin(2 * Math.PI * 0.22 * t);
  }
  ctx.lineWidth = 1;
  for (let i = 0; i * MM <= W; i++) {
    ctx.strokeStyle = i % 5 ? "rgba(96,165,250,0.08)" : "rgba(96,165,250,0.21)";
    ctx.beginPath(); ctx.moveTo(i * MM + 0.5, 0); ctx.lineTo(i * MM + 0.5, H); ctx.stroke();
  }
  for (let i = 0; i * MM <= H; i++) {
    ctx.strokeStyle = i % 5 ? "rgba(96,165,250,0.08)" : "rgba(96,165,250,0.21)";
    ctx.beginPath(); ctx.moveTo(0, i * MM + 0.5); ctx.lineTo(W, i * MM + 0.5); ctx.stroke();
  }
  const base = H * 0.66, cursor = 1010, gap = 18;
  ctx.strokeStyle = "#67E8F9"; ctx.lineWidth = 2; ctx.lineJoin = "round";
  ctx.shadowColor = "#67E8F9"; ctx.shadowBlur = 7;
  ctx.beginPath();
  let pen = false;
  for (let x = 0; x <= W; x++) {
    if (x > cursor && x < cursor + gap) { pen = false; continue; }
    const y = base - mv((x / W) * SECS) * 10 * MM;
    if (!pen) { ctx.moveTo(x, y); pen = true; } else { ctx.lineTo(x, y); }
  }
  ctx.stroke();
  ctx.fillStyle = "#67E8F9";
  ctx.beginPath(); ctx.arc(cursor, base - mv((cursor / W) * SECS) * 10 * MM, 3.5, 0, Math.PI * 2); ctx.fill();
</script>
</body>
</html>
